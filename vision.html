
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch AI Vision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111111;
      font-family: Arial, sans-serif;
      color: #ffffff;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 400px;
      padding: 35px 25px;
      text-align: center;
      background: #ffffff;
      color: #111111;
      border-radius: 20px;
      border: 3px solid #ff8a00;
      box-shadow: 0 0 25px #ff8a0040;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #ff8a00;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      color: #111111;
    }

    p {
      color: #555555;
      font-size: 15px;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #ff8a00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #e87900;
      transform: scale(1.02);
    }

    button:active {
      transform: scale(0.98);
    }

    input {
      display: none;
    }

    #status {
      margin-top: 20px;
      font-size: 13px;
      color: #555555;
      overflow-wrap: anywhere;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-top: 20px;
      border-radius: 10px;
      background: #eeeeee;
    }
  </style>
</head>

<body>

  <main class="panel">

    <div class="logo">SCRATCH AI</div>

    <h1>Vision</h1>

    <p>
      Sélectionne un fichier image pour commencer l'analyse.
    </p>

    <button id="chooseButton">
      📁 Choisir un fichier
    </button>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
    >

    <img id="preview" alt="Aperçu de l'image">

    <div id="status">En attente de ton fichier...</div>

  </main>

  <script>
    const button = document.getElementById("chooseButton");
    const input = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    button.addEventListener("click", () => {
      input.click();
    });

    input.addEventListener("change", () => {
      const file = input.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        status.textContent = "Format de fichier non accepté.";
        return;
      }

      if (file.size > 7 * 1024 * 1024) {
        status.textContent = "Fichier trop volumineux (maximum 7 Mo).";
        return;
      }

      status.textContent = "Lecture du fichier...";

      const reader = new FileReader();

      reader.onload = () => {
        const image = reader.result;

        preview.src = image;
        preview.style.display = "block";

        if (!window.opener || window.opener.closed) {
          status.textContent = "Impossible de communiquer avec Scratch.";
          return;
        }

        window.opener.postMessage({
          type: "SCRATCH_AI_VISION_IMAGE",
          image: image
        }, "*");

        status.textContent = "Fichier envoyé !";
      };

      reader.onerror = () => {
        status.textContent = "Erreur pendant la lecture du fichier.";
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
