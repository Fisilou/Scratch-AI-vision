
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scratch AI Vision</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #171923;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .panel {
      max-width: 420px;
      margin: 30px auto;
      padding: 22px;
      background: #252a3a;
      border-radius: 16px;
    }

    button, input {
      margin: 12px 0;
      padding: 12px;
      max-width: 100%;
    }

    button {
      background: #4b8cff;
      border: 0;
      border-radius: 9px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      max-width: 100%;
      max-height: 220px;
      margin-top: 12px;
      border-radius: 10px;
    }

    #status {
      color: #b9c8ff;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>Scratch AI Vision</h1>
    <p>Choisis une image à analyser.</p>

    <input id="image" type="file" accept="image/*">

    <br>

    <img id="preview" hidden alt="Aperçu de l'image">

    <div id="turnstile-container"></div>

    <p id="status">Chargement...</p>

    <button id="send">Envoyer l'image</button>
  </div>

  <script>
    "use strict";

    const SITEKEY = "øx4AAAAAAGG6rØ3bK_S0KgbM";

    let selectedImage = null;
    let turnstileToken = null;
    let turnstileLoaded = false;

    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const sendButton = document.getElementById("send");

    function loadTurnstile() {
      if (turnstileLoaded) return;

      if (location.hostname === "chatgpt.com" ||
          location.hostname === "chat.openai.com") {
        status.textContent =
          "Ouvre cette page depuis GitHub Pages pour utiliser Turnstile.";
        return;
      }

      turnstileLoaded = true;

      const script = document.createElement("script");
      script.src =
        "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      script.async = true;
      script.defer = true;

      script.onload = () => {
        window.turnstile.render(
          "#turnstile-container",
          {
            sitekey: SITEKEY,
            callback: (token) => {
              turnstileToken = token;
              status.textContent = "Vérification réussie !";
            },
            "error-callback": () => {
              status.textContent = "Erreur Turnstile.";
            },
            "expired-callback": () => {
              turnstileToken = null;
              status.textContent = "Vérification expirée.";
            }
          }
        );
      };

      script.onerror = () => {
        status.textContent =
          "Impossible de charger la vérification Cloudflare.";
        turnstileLoaded = false;
      };

      document.head.appendChild(script);
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      selectedImage = null;

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        status.textContent = "Choisis un fichier image.";
        return;
      }

      if (file.size > 5 * 1024 * 1024) {
        status.textContent = "Image trop volumineuse (5 Mo maximum).";
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        selectedImage = reader.result;
        preview.src = selectedImage;
        preview.hidden = false;
        status.textContent = "Image prête.";
        loadTurnstile();
      };

      reader.onerror = () => {
        status.textContent = "Impossible de lire l'image.";
      };

      reader.readAsDataURL(file);
    });

    sendButton.addEventListener("click", () => {
      if (!selectedImage) {
        status.textContent = "Choisis d'abord une image.";
        return;
      }

      if (!turnstileToken) {
        status.textContent = "Valide d'abord la vérification.";
        return;
      }

      if (!window.opener || window.opener.closed) {
        status.textContent =
          "La fenêtre TurboWarp n'est plus disponible.";
        return;
      }

      window.opener.postMessage(
        {
          type: "SCRATCH_AI_VISION_IMAGE",
          image: selectedImage,
          turnstileToken: turnstileToken
        },
        "https://turbowarp.org"
      );

      status.textContent = "Image envoyée !";
    });
  </script>
</body>
</html>
